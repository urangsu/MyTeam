name: MyTeam Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myteam-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    name: Static product contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify clean patch
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Run release contracts
        run: python3 scripts/validate_myteam_release.py

      - name: Run architecture contracts
        run: python3 scripts/validate_architecture_boundaries.py

      - name: Run natural-work contracts
        run: python3 scripts/validate_natural_work_routing.py

  macos-build-and-test:
    name: macOS Debug, XCTest, Release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Select reviewed Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project MyTeam/MyTeam.xcodeproj
          -scheme MyTeam
          -resolvePackageDependencies
          -derivedDataPath "$RUNNER_TEMP/MyTeamDerivedData"

      - name: Build Debug test bundle
        run: >-
          xcodebuild -quiet
          -project MyTeam/MyTeam.xcodeproj
          -scheme MyTeam
          -configuration Debug
          -destination 'platform=OS X,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/MyTeamDerivedData"
          build-for-testing

      - name: Run XCTest
        timeout-minutes: 12
        run: >-
          xcodebuild
          -project MyTeam/MyTeam.xcodeproj
          -scheme MyTeam
          -configuration Debug
          -destination 'platform=OS X,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/MyTeamDerivedData"
          test-without-building
          -resultBundlePath "$RUNNER_TEMP/MyTeamTests.xcresult"

      - name: Build Release
        run: >-
          xcodebuild -quiet
          -project MyTeam/MyTeam.xcodeproj
          -scheme MyTeam
          -configuration Release
          -destination 'platform=OS X,arch=arm64'
          -derivedDataPath "$RUNNER_TEMP/MyTeamDerivedData"
          build

      - name: Upload XCTest evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: MyTeamTests-${{ github.run_id }}
          path: ${{ runner.temp }}/MyTeamTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
